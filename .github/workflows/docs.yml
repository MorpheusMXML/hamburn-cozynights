name: Docs

# Documentation site in docs/ (VitePress). One source tree, two audiences
# (docs/develop/docs.md): GitHub Pages only ever gets the PUBLIC build, the
# guest guide. The full site with the admin guide is served by the app itself,
# behind the admin login, and is built into the Docker image.
# - Pull requests: build both audiences, so broken links or Markdown in either
#   fail the check.
# - Pushes to main: build the public audience and deploy it to GitHub Pages
#   (repository Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the "Last updated" dates come from git.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Build the public site (guest guide)
        run: npm run build:public
      - name: Build the full site (admin guide, reference, develop)
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: The public site must not contain admin-only sections
        run: |
          for section in admin develop reference superpowers; do
            if [ -e ".vitepress/dist/public/$section" ]; then
              echo "::error::docs/.vitepress/dist/public contains $section/"
              exit 1
            fi
          done
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
