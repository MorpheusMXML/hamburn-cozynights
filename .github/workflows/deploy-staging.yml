name: Deploy staging

# Manual only: Actions → "Deploy staging" → Run workflow. The `staging`
# environment only accepts `main` and requires reviewer approval.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test & build image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamburn-cozynights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: hamburn-cozynights/.nvmrc
          cache: npm
          cache-dependency-path: hamburn-cozynights/package-lock.json
      - run: npm ci
      - run: npm test
      # Same Dockerfile the server builds — fail here, not on the server.
      - run: docker build -t cozynights-ci .

  deploy:
    name: Deploy ${{ github.ref_name }}@${{ github.sha }}
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy on server
        # Pinned to a commit: this step receives the deploy key.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          username: deploy
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          # ECDSA host key fingerprint — the Go SSH client negotiates ECDSA
          # before ED25519 (see hamburn-cozynights/deploy/README.md).
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          command_timeout: 20m
          # The deploy key is a forced command on the server; only the commit
          # SHA in this string is used (see hamburn-cozynights/deploy/).
          script: deploy ${{ github.sha }}
