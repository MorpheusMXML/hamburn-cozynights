name: Deploy staging

# Manual only: Actions → "Deploy staging" → Run workflow. Pick the branch in
# "Use workflow from"; its current head commit is what gets deployed.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same verification every pull request gets (type check, unit,
  # integration and smoke tests incl. the Docker build) — fail here, not on
  # the server.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ github.ref_name }}@${{ github.sha }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test-cozynights.hamburn.de
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          username: deploy
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          command_timeout: 20m
          # The deploy key is a forced command on the server; only the commit
          # SHA in this string is used (see hamburn-cozynights/deploy/).
          script: deploy ${{ github.sha }}

  # The server-side health check only proves that the app answers. This asks
  # the deployed site from the outside: pages, app → PocketBase → service
  # account, Google login configured, admin area closed. Read-only.
  smoke:
    name: Smoke test staging
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamburn-cozynights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hamburn-cozynights/package-lock.json
      - run: npm ci
      - run: npm run smoke:remote
        env:
          SMOKE_BASE_URL: https://test-cozynights.hamburn.de
          SMOKE_EXPECT_GOOGLE: '1'
