<!doctype html>
<!--
  What nginx shows when the app doesn't answer (its own 502 / 504, e.g. a
  restart or the opening rush): deploy/nginx/*.conf, error_page. Installed as
  /var/www/cozynights/cozy-down.html (deploy/README.md). Self-contained: no
  fonts, scripts or images from anywhere, so it works while everything else is
  down. It reloads itself after 15 seconds.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="refresh" content="15" />
		<meta name="robots" content="noindex" />
		<title>CozyNights · one moment</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #000;
				color: #e5e5e5;
				font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				text-align: center;
				padding: 24px;
				box-sizing: border-box;
			}
			main {
				max-width: 30rem;
			}
			.flame {
				font-size: 3rem;
				animation: flicker 1.6s ease-in-out infinite;
			}
			h1 {
				margin: 0.5rem 0;
				font-size: 1.4rem;
				letter-spacing: 3px;
				color: #f472b6;
				text-shadow: 0 0 12px #f472b6;
			}
			p {
				line-height: 1.6;
				margin: 0.75rem 0;
			}
			.small {
				color: #a3a3a3;
				font-size: 0.9rem;
			}
			@keyframes flicker {
				50% {
					opacity: 0.6;
					transform: scale(0.95);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.flame {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div class="flame" aria-hidden="true">🔥</div>
			<h1>STOKING THE FIRE</h1>
			<p>
				CozyNights is busy or restarting for a moment. This page tries again by itself in 15
				seconds.
			</p>
			<p>
				If you were booking: wait for the page to come back and check whether the spot shows as
				yours before you try again.
			</p>
			<p class="small">Still here after a few minutes? Tell the crew.</p>
		</main>
	</body>
</html>
