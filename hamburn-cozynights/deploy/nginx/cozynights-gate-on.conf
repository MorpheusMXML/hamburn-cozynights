# /etc/nginx/snippets/cozynights-gate-on.conf — the pre-launch gate is ON.
#
# Included inside the production vhost's `server {}` through the symlink
# /etc/nginx/snippets/cozynights-gate.conf; `cozynights-gate on|off` swaps the
# link (deploy/gate/cozynights-gate). Every request first needs a gate session:
# a Google sign-in with a mauersegler.art account, checked by oauth2-proxy
# (deploy/gate/docker-compose.yml, 127.0.0.1:4180). Without one, nginx hands
# the request to /oauth2/start, which answers with a 302 to Google and comes
# back to the page that was asked for.
#
# Only exception: /api/health (status, version, commit), for the deploy's
# smoke test and uptime checks. It shows no guest or admin data.

auth_request /oauth2/auth;
error_page 401 = /oauth2/start;

# Sign-in, callback and sign-out of the gate itself. A proxy_set_header here
# replaces the vhost's list, so all of it again.
location /oauth2/ {
    auth_request off;
    limit_req zone=perip burst=60 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Where to go after the sign-in: the original request, unchanged
    # ($request_uri survives the internal redirect of error_page).
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}

# The check behind auth_request: 202 = signed in, 401 = not.
location = /oauth2/auth {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:4180;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
}

location = /api/health {
    auth_request off;
    limit_req zone=perip burst=60 nodelay;
    proxy_pass http://127.0.0.1:3002;
}
