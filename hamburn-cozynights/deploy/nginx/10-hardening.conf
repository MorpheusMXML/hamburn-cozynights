# /etc/nginx/conf.d/10-hardening.conf: defaults for every vhost on this host.
# Debian's nginx.conf includes conf.d/*.conf inside http {}, before the vhosts.
# Installed by hand like the vhosts; source: deploy/nginx/10-hardening.conf in
# the CozyNights repository. After changes: nginx -t && systemctl reload nginx

# No version in the Server header or on error pages of any vhost.
server_tokens off;

# Response-header buffers for every proxied app. nginx's 4 KB default answered
# 502 to signed-in CozyNights admins (long Link and CSP headers plus the session
# cookie). Vhosts and locations may still set their own values.
proxy_buffer_size 16k;
proxy_buffers 4 16k;
proxy_busy_buffers_size 32k;

# Per-address request limit. Declared here, applied per vhost with
#   limit_req zone=perip burst=60 nodelay;
# 10 MB of state holds roughly 160,000 addresses. Rejected requests get 429 and
# one warning line in the vhost's error log.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# HSTS for vhosts that set no add_header of their own. nginx does not merge
# add_header across levels: a vhost with its own add_header lines keeps exactly
# those, so the CozyNights vhost carries its own HSTS line.
add_header Strict-Transport-Security "max-age=86400" always;
