# Production vhost. Install as /etc/nginx/sites-available/cozynights.hamburn.de,
# symlink into sites-enabled. The certificate comes first, with a port-80-only
# vhost and `certbot certonly --nginx -d cozynights.hamburn.de` (runbook:
# deploy/README.md, "Produktion"); certbot does not rewrite this file.
#
# Same shape as test-cozynights.hamburn.de.conf (host-wide defaults and the
# request-limit zone `perip` in 10-hardening.conf), plus the pre-launch gate:
#
#   /etc/nginx/snippets/cozynights-gate.conf is a symlink to either
#     cozynights-gate-on.conf   every visitor signs in with a mauersegler.art
#                               Google account first (oauth2-proxy, deploy/gate/)
#     cozynights-gate-off.conf  public: the site as it runs after the launch
#   and `cozynights-gate on|off|status` (deploy/gate/cozynights-gate) switches it.
#
# PocketBase is not proxied, exactly as on staging: its dashboard is reached
# via SSH tunnel to 127.0.0.1:8092 only.

server {
    listen 80;
    listen [::]:80;
    server_name cozynights.hamburn.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Kept-open connections to the app (v1.32.3): no new TCP handshake per
# request during the opening rush. 4 s idle, below Node's 5 s keepAliveTimeout,
# so nginx never reuses a connection the app is closing.
upstream cozynights_production_app {
    server 127.0.0.1:3002;
    keepalive 32;
    keepalive_timeout 4s;
}

server {
    # nginx 1.22 (Debian 12): the protocol on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cozynights.hamburn.de;

    ssl_certificate /etc/letsencrypt/live/cozynights.hamburn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cozynights.hamburn.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # The app sets its own security headers (src/hooks.server.ts); only HSTS
    # comes from here. Start short, raise max-age to 31536000 once HTTPS has
    # been clean for a week. No X-Robots-Tag: production may be indexed (the
    # gate answers every crawler with a redirect to Google anyway).
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Shared by every proxied location below that sets no proxy_set_header of
    # its own (the gate's /oauth2/ locations repeat them).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    # Signed-in browsers get response headers larger than nginx's 4k default.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    # HTTP/1.1 without "Connection: close", for the upstream's keepalive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Page data (__data.json), form answers and the admin JSON go out
    # compressed; the built JS/CSS come precompressed from the app already.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # The app down or too slow (nginx's own 502/504, never the app's 503
    # pages): a friendly page that retries by itself. Installed with
    # deploy/nginx/cozy-down.html → /var/www/cozynights/ (deploy/README.md).
    error_page 502 504 /cozy-down.html;
    location = /cozy-down.html {
        root /var/www/cozynights;
        internal;
    }

    # The pre-launch gate, on or off (see the top of this file).
    include /etc/nginx/snippets/cozynights-gate.conf;

    # Built assets: no request limit (about 25 per page load, many guests
    # behind one address).
    # The app has no remote functions; SvelteKit would still run its request
    # handling (and the guest cookie check) for these, outside the limit below.
    location ^~ /_app/remote/ {
        return 404;
    }
    location ^~ /_app/ {
        proxy_pass http://cozynights_production_app;
    }

    # 20 requests per second per address, burst 60, then 429 (zone `perip`).
    location / {
        limit_req zone=perip burst=60 nodelay;
        proxy_pass http://cozynights_production_app;
    }

    error_log /var/log/nginx/cozynights.error.log;
    access_log /var/log/nginx/cozynights.access.log;
}
