# Deploy this to /etc/nginx/sites-available/test-cozynights.hamburn.de on the server,
# symlink into sites-enabled, then run:
#   certbot --nginx -d test-cozynights.hamburn.de
# (certbot rewrites the 443 block and adds the http->https redirect itself)
#
# Only the SvelteKit app is exposed. PocketBase is deliberately NOT proxied:
# the browser never talks to it (all PocketBase calls are server-side over the
# compose network), and its dashboard is reached via SSH tunnel to
# 127.0.0.1:8091 only. The admin area is protected by the app's own Google
# login (see docs/admin/access.md in the repository root).

server {
    listen 80;
    listen [::]:80;
    server_name test-cozynights.hamburn.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test-cozynights.hamburn.de;

    ssl_certificate /etc/letsencrypt/live/test-cozynights.hamburn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-cozynights.hamburn.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Security headers of the TLS terminator. The app adds its own
    # (nosniff, frame-ancestors, referrer policy, …) in src/hooks.server.ts;
    # add_header would only append duplicates, so nothing is repeated here.
    # HSTS starts short; raise max-age to 31536000 once HTTPS has been clean
    # for a week. Also set `server_tokens off;` in the http{} block of
    # /etc/nginx/nginx.conf so error pages of every vhost hide the version.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Staging only: keep the test site out of search engines (production uses
    # static/robots.txt instead).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SvelteKit app (adapter-node)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_log /var/log/nginx/test-cozynights.error.log;
    access_log /var/log/nginx/test-cozynights.access.log;
}
