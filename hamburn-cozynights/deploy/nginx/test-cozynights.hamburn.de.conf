# Deploy this to /etc/nginx/sites-available/test-cozynights.hamburn.de on the server,
# symlink into sites-enabled, `nginx -t && systemctl reload nginx`, THEN run:
#   certbot --nginx -d test-cozynights.hamburn.de
#
# Deliberately just one plain HTTP server block below, with the real proxy
# rules already on it — certbot's --nginx plugin needs a working, already-
# reloaded HTTP vhost for this domain to attach to. Given one, it adds its
# own `listen 443 ssl` server block (copying this block's locations into
# it) and rewrites this block into the http->https redirect, obtaining and
# wiring up the certificate along the way. Pre-baking a 443 block with
# ssl_certificate paths under /etc/letsencrypt/live/... here instead would
# make `nginx -t` fail before certbot ever runs, since those files don't
# exist yet on a fresh domain.

server {
    listen 80;
    listen [::]:80;
    server_name test-cozynights.hamburn.de;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # PocketBase API, reachable at /pb/... — proxy_pass with trailing slashes
    # strips the /pb/ prefix so PocketBase sees plain /api/... requests.
    location /pb/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SvelteKit app (adapter-node)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    error_log /var/log/nginx/test-cozynights.error.log;
    access_log /var/log/nginx/test-cozynights.access.log;
}
