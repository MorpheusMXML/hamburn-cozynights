# Deploy this to /etc/nginx/sites-available/test-cozynights.hamburn.de on the server,
# symlink into sites-enabled, then run:
#   certbot --nginx -d test-cozynights.hamburn.de
# (certbot rewrites the 443 block and adds the http->https redirect itself)

server {
    listen 80;
    listen [::]:80;
    server_name test-cozynights.hamburn.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test-cozynights.hamburn.de;

    ssl_certificate /etc/letsencrypt/live/test-cozynights.hamburn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-cozynights.hamburn.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # PocketBase API, reachable at /pb/... — proxy_pass with trailing slashes
    # strips the /pb/ prefix so PocketBase sees plain /api/... requests.
    location /pb/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SvelteKit app (adapter-node)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_log /var/log/nginx/test-cozynights.error.log;
    access_log /var/log/nginx/test-cozynights.access.log;
}
