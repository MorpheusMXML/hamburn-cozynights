# Deploy this to /etc/nginx/sites-available/test-cozynights.hamburn.de on the server,
# symlink into sites-enabled, then run:
#   certbot --nginx -d test-cozynights.hamburn.de
# (certbot rewrites the 443 block and adds the http->https redirect itself)
#
# Host-wide defaults (server_tokens off, the 16k proxy buffers, the request-limit
# zone `perip`, an HSTS fallback) live in 10-hardening.conf next to this file,
# installed as /etc/nginx/conf.d/10-hardening.conf. This vhost needs that zone.
#
# Only the SvelteKit app is exposed. PocketBase is deliberately NOT proxied:
# the browser never talks to it (all PocketBase calls are server-side over the
# compose network), and its dashboard is reached via SSH tunnel to
# 127.0.0.1:8091 only. The admin area is protected by the app's own Google
# login (see docs/admin/access.md in the repository root).

server {
    listen 80;
    listen [::]:80;
    server_name test-cozynights.hamburn.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    # nginx 1.22 (Debian 12) takes the protocol on the listen line; the
    # `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-cozynights.hamburn.de;

    ssl_certificate /etc/letsencrypt/live/test-cozynights.hamburn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-cozynights.hamburn.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Security headers of the TLS terminator. The app adds its own
    # (nosniff, frame-ancestors, referrer policy, …) in src/hooks.server.ts;
    # add_header would only append duplicates, so nothing is repeated here.
    # HSTS starts short; raise max-age to 31536000 once HTTPS has been clean
    # for a week. (server_tokens off is host-wide in 10-hardening.conf and
    # repeated here so this file also works on its own.)
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    # Staging only: keep the test site out of search engines (production uses
    # static/robots.txt instead).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Shared by every proxied location below (adapter-node behind nginx: the
    # real client IP for the ticket-code rate limit comes from X-Real-IP).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    # The app's response headers exceed nginx's default 4k buffer for
    # signed-in browsers (pb_auth cookie + SvelteKit's modulepreload Link
    # header + the CSP headers): nginx would answer 502 "upstream sent too
    # big header". Seen on staging on 2026-09-19.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;

    # Built assets are content-hashed and about 25 per page load: no request
    # limit here, so a crowd behind one address (festival Wi-Fi, mobile
    # carriers) is not cut off by its own page loads.
    location ^~ /_app/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Pages, form actions, /api/health, /docs: 20 requests per second per
    # address with a burst of 60, then 429 (zone `perip` from 10-hardening.conf).
    # The app keeps its own, stricter limits for ticket-code and pass guessing.
    location / {
        limit_req zone=perip burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_log /var/log/nginx/test-cozynights.error.log;
    access_log /var/log/nginx/test-cozynights.access.log;
}
