services:
  pocketbase:
    # Pinned: JS hooks/migrations in pb_hooks/ and pb_migrations/ are written
    # against this PocketBase version's JSVM API, and PocketBase's own system
    # migrations are one-way. Bump deliberately, after a volume backup.
    image: ghcr.io/muchobien/pocketbase:0.40.4
    container_name: cozynights-staging-pocketbase
    restart: unless-stopped
    # --automigrate=false: schema changes only ever come from committed
    # migrations, never from dashboard edits writing files into the checkout.
    command: ['--http=0.0.0.0:8090', '--automigrate=false']
    environment:
      # Google OAuth client for the admin login (auth collection `admins`),
      # interpolated from .env — see .env.example and docs/DEPLOYMENT.md.
      PB_GOOGLE_CLIENT_ID: ${PB_GOOGLE_CLIENT_ID:?set PB_GOOGLE_CLIENT_ID in .env}
      PB_GOOGLE_CLIENT_SECRET: ${PB_GOOGLE_CLIENT_SECRET:?set PB_GOOGLE_CLIENT_SECRET in .env}
      # Optional: chat webhook notified about new admin access requests
      # (Telegram / Slack / Google Chat / Discord), see .env.example.
      COZY_ADMIN_WEBHOOK_URL: ${COZY_ADMIN_WEBHOOK_URL:-}
      # NOTE: never pass PB_ADMIN_EMAIL/PB_ADMIN_PASSWORD to this container —
      # the image's entrypoint would re-upsert that superuser on every start,
      # which revokes the app's cached service-account token.
    ports:
      # Only reachable from the host itself (SSH tunnel for the dashboard at /_/),
      # never from the internet.
      - '127.0.0.1:8091:8090'
    volumes:
      - pb_data_staging:/pb_data
      - ./pb_migrations:/pb_migrations:ro
      - ./pb_hooks:/pb_hooks:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8090/api/health']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cozynights_staging_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cozynights-staging-app
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Server-side PocketBase URL over the compose network. The browser never
      # talks to PocketBase directly, so there is no public PocketBase URL.
      PB_URL: http://pocketbase:8090
      ORIGIN: https://test-cozynights.hamburn.de
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # adapter-node behind nginx: the real client IP (used by the ticket-code
      # login rate limit) comes from nginx's X-Real-IP header.
      ADDRESS_HEADER: x-real-ip
    ports:
      # Only reachable from the host itself; nginx reverse-proxies to this.
      - '127.0.0.1:3001:3000'
    networks:
      - cozynights_staging_net

networks:
  cozynights_staging_net:
    driver: bridge

volumes:
  pb_data_staging:
