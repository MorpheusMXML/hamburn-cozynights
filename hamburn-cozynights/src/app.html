<!doctype html>
<!-- translate="no": the app is English only. Browser auto-translation rewrites
     text nodes behind Svelte's back, which breaks live updates (countdown,
     status texts) on translated pages. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="google" content="notranslate" />
		<meta name="theme-color" content="#050505" />
		<style>
			html {
				background: #050505;
			}
		</style>
		%sveltekit.head%
	</head>
	<!-- Data is preloaded when a link is tapped or pressed, not when the mouse
	     only passes over it: a hover ran a page's whole server load for nothing,
	     and a click minutes later showed spots as they were back then. The code
	     still loads on hover, as before (static files, no server load). -->
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
