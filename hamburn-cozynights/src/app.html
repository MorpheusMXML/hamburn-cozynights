<!doctype html>
<!-- translate="no": the app is English only. Browser auto-translation rewrites
     text nodes behind Svelte's back, which breaks live updates (countdown,
     status texts) on translated pages. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="google" content="notranslate" />
		<meta name="theme-color" content="#050505" />
		<style>
			html {
				background: #050505;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
