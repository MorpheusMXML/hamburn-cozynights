# Production: https://cozynights.hamburn.de
#
# The same stack as docker-compose.staging.yml, on the same server, but apart
# from it in everything that holds state or listens: its own project name,
# containers, network, ports, database volume and .env (production.env.template).
# Deployed only from `main` (.github/workflows/deploy-production.yml, the
# runbook is deploy/README.md, section "Produktion").
#
# Until launch day nginx keeps a Google sign-in gate in front of this site
# (deploy/gate/, deploy/nginx/cozynights-gate-*.conf). The gate lives in nginx,
# not here: this stack runs exactly as it will after the launch.
name: cozynights-production

services:
  pocketbase:
    # Pinned, like staging: JS hooks/migrations in pb_hooks/ and pb_migrations/
    # are written against this PocketBase version's JSVM API, and PocketBase's
    # own system migrations are one-way. Bump deliberately, after a backup.
    image: ghcr.io/muchobien/pocketbase:0.40.4
    container_name: cozynights-production-pocketbase
    restart: unless-stopped
    # Same flags as staging (docker-compose.staging.yml explains each one):
    # schema only from committed migrations, no hook reload on checkout, the
    # settings row encrypted with PB_ENCRYPTION_KEY.
    command:
      [
        '--http=0.0.0.0:8090',
        '--automigrate=false',
        '--hooksWatch=false',
        '--encryptionEnv=PB_ENCRYPTION_KEY'
      ]
    environment:
      # Exactly 32 characters, `openssl rand -hex 16`, never staging's value.
      # Required on purpose: a deploy without it fails at the build step.
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?set PB_ENCRYPTION_KEY in .env (32 characters, see deploy/production.env.template)}
      # Google OAuth client for the admin login; production has its own client
      # (redirect URI https://cozynights.hamburn.de/auth/callback/google).
      PB_GOOGLE_CLIENT_ID: ${PB_GOOGLE_CLIENT_ID:?set PB_GOOGLE_CLIENT_ID in .env}
      PB_GOOGLE_CLIENT_SECRET: ${PB_GOOGLE_CLIENT_SECRET:?set PB_GOOGLE_CLIENT_SECRET in .env}
      # Notifications (pb_hooks/cozy_notify.pb.js, docs/admin/notifications.md),
      # all optional: without SMTP_HOST / TELEGRAM_BOT_TOKEN nothing is sent.
      # Production has its own SMTP user. It shares staging's Telegram bot, but
      # only one of the two may poll it for messages (TELEGRAM_GUEST_UPDATES=off
      # on the other one), or they steal each other's messages.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
      SMTP_LOCAL_NAME: ${SMTP_LOCAL_NAME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      TELEGRAM_GUEST_UPDATES: ${TELEGRAM_GUEST_UPDATES:-}
      COZY_ADMIN_WEBHOOK_URL: ${COZY_ADMIN_WEBHOOK_URL:-}
      # Links in messages. No environment marker in subjects and crew messages
      # by default; COZY_ENV_LABEL in .env adds one (e.g. during a dry run).
      COZY_APP_URL: https://cozynights.hamburn.de
      COZY_ENV_LABEL: ${COZY_ENV_LABEL:-}
      # Local auto-backups into the volume's backups/ folder (defaults: once a
      # day at 03:05 UTC, keep 14), see pb_hooks/cozy_backups.pb.js. Off-site:
      # deploy/backup/.
      PB_BACKUP_CRON: ${PB_BACKUP_CRON:-}
      PB_BACKUP_KEEP: ${PB_BACKUP_KEEP:-}
      COZY_NOTIFY_LOOP_SECONDS: ${COZY_NOTIFY_LOOP_SECONDS:-}
      COZY_MAILS_PER_MINUTE: ${COZY_MAILS_PER_MINUTE:-}
      # NOTE: never pass PB_ADMIN_EMAIL/PB_ADMIN_PASSWORD to this container
      # (docker-compose.staging.yml says why: the container would not start).
    security_opt:
      - no-new-privileges:true
    ports:
      # Only reachable from the host itself (SSH tunnel for the dashboard at
      # /_/), never from the internet. Staging uses 8091.
      - '127.0.0.1:8092:8090'
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations:ro
      - ./pb_hooks:/pb_hooks:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8090/api/health']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cozynights_production_net

  app:
    build:
      # The repository root: the image also contains the documentation site.
      context: ..
      dockerfile: hamburn-cozynights/Dockerfile
      args:
        # The deployed commit, for the version badge and /api/health.
        GIT_SHA: ${GIT_SHA:-}
    container_name: cozynights-production-app
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    # No env_file on purpose, like staging: .env also holds PocketBase's
    # secrets, so every value the app needs is listed here and nothing else
    # reaches this container.
    environment:
      PB_URL: http://pocketbase:8090
      ORIGIN: https://cozynights.hamburn.de
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # The real client IP (ticket-code rate limit) comes from nginx.
      ADDRESS_HEADER: x-real-ip
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      # Production's own key, never staging's. Never changed once real
      # bookings exist: burner names and ticket-code hashes depend on it.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Wallet passes (optional, without them no wallet button shows). The pass
      # ids carry this environment's host, so staging's passes never collide.
      WALLET_APPLE_PASS_TYPE_ID: ${WALLET_APPLE_PASS_TYPE_ID:-}
      WALLET_APPLE_TEAM_ID: ${WALLET_APPLE_TEAM_ID:-}
      WALLET_APPLE_CERT: ${WALLET_APPLE_CERT:-}
      WALLET_APPLE_KEY: ${WALLET_APPLE_KEY:-}
      WALLET_APPLE_WWDR: ${WALLET_APPLE_WWDR:-}
      WALLET_GOOGLE_ISSUER_ID: ${WALLET_GOOGLE_ISSUER_ID:-}
      WALLET_GOOGLE_SERVICE_ACCOUNT: ${WALLET_GOOGLE_SERVICE_ACCOUNT:-}
      WALLET_EVENT_NAME: ${WALLET_EVENT_NAME:-}
      WALLET_EVENT_START: ${WALLET_EVENT_START:-}
      WALLET_EVENT_END: ${WALLET_EVENT_END:-}
      WALLET_VENUE_NAME: ${WALLET_VENUE_NAME:-}
      WALLET_VENUE_ADDRESS: ${WALLET_VENUE_ADDRESS:-}
      WALLET_VENUE_LATITUDE: ${WALLET_VENUE_LATITUDE:-}
      WALLET_VENUE_LONGITUDE: ${WALLET_VENUE_LONGITUDE:-}
      WALLET_ORGANIZATION: ${WALLET_ORGANIZATION:-}
      # Operator details for /legal-notice and /privacy (src/lib/server/legal.ts).
      # Same list as docker-compose.staging.yml: a key missing here is silently
      # blank on those pages.
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_REPRESENTATIVE: ${LEGAL_REPRESENTATIVE:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_REGISTER: ${LEGAL_REGISTER:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_CONTENT_RESPONSIBLE: ${LEGAL_CONTENT_RESPONSIBLE:-}
      LEGAL_PRIVACY_EMAIL: ${LEGAL_PRIVACY_EMAIL:-}
      LEGAL_HOSTER: ${LEGAL_HOSTER:-}
      LEGAL_MAIL_PROVIDER: ${LEGAL_MAIL_PROVIDER:-}
      LEGAL_SUPERVISORY_AUTHORITY: ${LEGAL_SUPERVISORY_AUTHORITY:-}
      LEGAL_LOG_RETENTION_DAYS: ${LEGAL_LOG_RETENTION_DAYS:-}
      LEGAL_DELETION_PERIOD: ${LEGAL_DELETION_PERIOD:-}
      LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-}
      LEGAL_CODE_OF_CONDUCT_URL: ${LEGAL_CODE_OF_CONDUCT_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Only reachable from the host itself; nginx reverse-proxies to this.
      # Staging uses 3001.
      - '127.0.0.1:3002:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cozynights_production_net

networks:
  cozynights_production_net:
    driver: bridge

volumes:
  pb_data:
    # Pinned on purpose (see docker-compose.staging.yml): whatever project name
    # a command runs with, it always finds production's database and never
    # creates an empty one next to it.
    name: cozynights-production_pb_data
